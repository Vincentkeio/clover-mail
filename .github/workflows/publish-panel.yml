name: publish-panel

# 构建并发布面板镜像到 GHCR。
#
# 平台策略（实测教训）：默认**只构建 linux/amd64** —— 绝大多数 VPS 是 amd64；
# arm64 走 QEMU 模拟编译 better-sqlite3 原生模块，既慢又容易 OOM 被杀
# （实测一次 3 分钟失败、一次 15 分钟仍未完）。
# 需要 arm64 时在 Actions 页手动 Run workflow，platforms 选 amd64+arm64。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'panel/**'
      - '.github/workflows/publish-panel.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台（arm64 走 QEMU 模拟，很慢，按需选）'
        type: choice
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'

concurrency:
  group: publish-panel-${{ github.ref }}
  # 新推送取消同分支上排队/进行中的旧构建，避免浪费 runner 分钟
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clover-panel
  PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta（生成标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: QEMU（仅多架构时需要）
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./panel
          file: ./panel/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 结果摘要
        run: |
          {
            echo "### clover-panel 已发布"
            echo ""
            echo "- 平台：\`${{ env.PLATFORMS }}\`"
            echo "- digest：\`${{ steps.build.outputs.digest }}\`"
            echo "- 标签："
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
